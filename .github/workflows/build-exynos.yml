name: Montagem Exynos850 4GB MOD
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK MOD
        run: |
          echo "Building Winlator 7.1 base for Exynos850"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug
      - name: Upload MOD
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Exynos850-4GB-MOD-FIXED
          path: app/build/outputs/apk/debug/*.apk
