name: Build Exynos850 4GB MOD
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Patch Exynos 850 Mali Fix
        run: |
          echo "BOX64_DYNAREC_STRONGMEM=1" >> app/src/main/cpp/box64.conf || echo "BOX64_DYNAREC_STRONGMEM=1" > app/src/main/cpp/box64.conf
          echo "BOX64_DYNAREC_BIGBLOCK=0" >> app/src/main/cpp/box64.conf
          echo "Patched for SM-A135M 4GB - fixes SIGBUS 7"
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK MOD
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Exynos850-4GB-MOD
          path: app/build/outputs/apk/debug/*.apk
